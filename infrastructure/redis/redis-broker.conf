# Redis — Celery broker instance (redis-broker).
#
# Queued tasks must never be evicted or lost:
#   * noeviction  — reject writes instead of silently dropping queued tasks
#   * appendonly  — AOF persistence so pending tasks survive restarts
# Broker and results use separate logical DBs (see CELERY_* settings).
maxmemory 256mb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
save ""
