# UoG Digital Platform — development routing.
#
#   /                  -> frontend-public  (Next.js, port 3000 in-container)
#   /admin/            -> frontend-admin   (Next.js with basePath /admin)
#   /api/auth/         -> frontend-public  (Auth.js endpoints of public-web)
#   /api/              -> backend          (Django REST framework)
#   /health/           -> backend          (liveness / readiness)
#   /django-admin/     -> backend          (Django admin UI, rewritten)
#
# Ingress policy:
#   - Only requests matching known hosts (localhost, 127.0.0.1) are processed.
#     All other hosts receive HTTP 444 (connection dropped) via the `if`
#     directive in the server block below.
#   - All routes below are only reached when the host check passes.
#   - TLS is not terminated at the ingress in development (HTTP only).
#   - Requests are forwarded to container services via Docker network names.
#
#   Known hosts:
#     - localhost        → public + admin frontends + backend
#     - 127.0.0.1        → same as localhost (fallback)
#     - *.uog.local      → development addresses of the institutional
#                          websites seeded by the Sites foundation
#                          (www.uog.local, informatics.uog.local,
#                          medicine.uog.local, research.uog.local).
#                          Django selects the Site from the Host header and
#                          its SiteDomain rows; the production deployment
#                          replaces this development allow-list with the
#                          real institutional domains via its environment.
#     - All other hosts  → HTTP 444 (dropped connection)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend_api {
    server backend:8000;
}

upstream frontend_public {
    server frontend-public:3000;
}

upstream frontend_admin {
    server frontend-admin:3000;
}

server {
    listen 80;
    server_name _;

    # Development ingress admits only the platform hosts and the configured
    # development site addresses above. Institutional websites are selected
    # by Django from the Host header and SiteDomain rows — nginx never
    # routes by hostname, it only gates which hostnames reach the backend.
    # Single-escape (`\.`) is the correct PCRE form; a doubled backslash
    # matches a literal backslash and would reject 127.0.0.1 outright.
    if ($host !~ ^(localhost|127\.0\.0\.1|([a-z0-9-]+\.)*uog\.local)$ ) {
        return 444;
    }

    client_max_body_size 25m;

    # Nginx's own liveness (used by the container healthcheck).
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Auth.js of the public app (must precede the generic /api/ location).
    location /api/auth/ {
        proxy_pass http://frontend_public;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Replace any client-supplied value. Django does not trust this header.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django REST API
    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        # Replace any client-supplied value. Django does not trust this header.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health endpoints
    location /health/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        # Replace any client-supplied value. Django does not trust this header.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin UI (backend serves it under /admin; expose as /django-admin)
    location /django-admin/ {
        proxy_pass http://backend_api/admin/;
        proxy_set_header Host $host;
        # Replace any client-supplied value. Django does not trust this header.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin console (Next.js with basePath /admin). The exact match keeps
    # /admin out of the redirect nginx would otherwise issue towards
    # /admin/ — Next.js answers /admin/ with a redirect to /admin, which
    # would send the browser round and round.
    location = /admin {
        proxy_pass http://frontend_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Replace any client-supplied value. Django does not trust this header.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://frontend_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Replace any client-supplied value. Django does not trust this header.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public website (Next.js) — everything else
    location / {
        proxy_pass http://frontend_public;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Replace any client-supplied value. Django does not trust this header.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
