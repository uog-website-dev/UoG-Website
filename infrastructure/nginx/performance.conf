# No request URI/access logging: OAuth callback query values are sensitive.
server {
 listen 80;
 server_name localhost;
 access_log off;
 error_log /dev/null crit;
 # Match the normal gateway: encrypted/chunked Auth.js cookies need these buffers.
 proxy_buffer_size 32k;
 proxy_buffers 8 32k;
 proxy_busy_buffers_size 64k;
 large_client_header_buffers 4 32k;
 # Browser probes during OAuth redirects also request the public-root icon.
 # The normal gateway serves it via public-web; this isolated stack has no public-web.
 location = /favicon.ico {
  proxy_pass http://perf-admin:3000/admin/favicon.ico;
  proxy_set_header Host $http_host;
 }
 location /admin {
  proxy_pass http://perf-admin:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 180s;
  proxy_buffering off;
 }
 location /api/ {
  proxy_pass http://perf-backend:8000;
  proxy_set_header Host $host;
  proxy_read_timeout 120s;
 }
 location /health/ { proxy_pass http://perf-backend:8000; proxy_set_header Host $host; }
}
