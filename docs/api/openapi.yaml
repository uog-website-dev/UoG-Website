            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
        '409':
          description: Duplicate normalized code, database integrity/concurrent transaction
            conflict, or hierarchy response exceeding 1000 nodes. Reconcile state
            or navigate smaller branches/use the paginated list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        description: Optional UUID correlation ID. Invalid values are replaced.
        schema:
          type: string
          format: uuid
components:
  schemas:
    AdminOverview:
      type: object
      properties:
        pages:
          type: integer
          minimum: 0
        published_pages:
          type: integer
          minimum: 0
        users:
          type: integer
          minimum: 0
        requested_by:
          type: string
      required:
      - pages
      - published_pages
      - requested_by
      - users
    Identity:
      type: object
      properties:
        username:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        is_staff:
          type: boolean
        client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: integer
          description: Access-token expiry as Unix seconds.
      required:
      - client_id
      - email
      - expires_at
      - is_staff
      - name
      - roles
      - scopes
      - username
    Organization:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: Whitespace is trimmed and letters uppercased. Immutable after
            creation.
          maxLength: 64
        name:
          type: string
          maxLength: 255
        short_name:
          type: string
          maxLength: 100
        organization_type:
          type: string
          description: Stable type code, for example COLLEGE. Type changes follow
            root and lifecycle rules.
        parent:
          type: integer
          nullable: true
          description: Leave empty only for the single institutional root.
        description:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - organization_type
      - status
      - updated_at
    OrganizationHierarchy:
      type: object
      properties:
        count:
          type: integer
          maximum: 1000
          minimum: 0
          readOnly: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
          readOnly: true
      required:
      - count
      - results
    OrganizationRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Whitespace is trimmed and letters uppercased. Immutable after
            creation.
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 255
        short_name:
          type: string
          maxLength: 100
        organization_type:
          type: string
          minLength: 1
          description: Stable type code, for example COLLEGE. Type changes follow
            root and lifecycle rules.
        parent:
          type: integer
          nullable: true
          description: Leave empty only for the single institutional root.
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            nullable: true
      required:
      - code
      - name
      - organization_type
    OrganizationUpdate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          description: Whitespace is trimmed and letters uppercased. Immutable after
            creation.
        name:
          type: string
          maxLength: 255
        short_name:
          type: string
          maxLength: 100
        organization_type:
          type: string
          description: Stable type code, for example COLLEGE. Type changes follow
            root and lifecycle rules.
        parent:
          type: integer
          nullable: true
          description: Leave empty only for the single institutional root.
        description:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        metadata:
          type: object
          additionalProperties:
            nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - id
      - name
      - organization_type
      - status
      - updated_at
    Page:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        content:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_published:
          type: boolean
      required:
      - content
      - created_at
      - id
      - slug
      - title
      - updated_at
    PageRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        content:
          type: string
          minLength: 1
        description:
          type: string
        is_published:
          type: boolean
      required:
      - content
      - slug
      - title
    PaginatedOrganizationList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
    PaginatedPageList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Page'
    PatchedOrganizationUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        short_name:
          type: string
          maxLength: 100
        organization_type:
          type: string
          minLength: 1
          description: Stable type code, for example COLLEGE. Type changes follow
            root and lifecycle rules.
        parent:
          type: integer
          nullable: true
          description: Leave empty only for the single institutional root.
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            nullable: true
    PatchedPageRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        content:
          type: string
          minLength: 1
        description:
          type: string
        is_published:
          type: boolean
    StatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
        * `ARCHIVED` - Archived
    APIError:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: The request is invalid.
            details:
              description: Field errors or a detail message from DRF.
        request_id:
          type: string
          format: uuid
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token. Signature, issuer, audience, expiry and
        authorized client are verified by the backend. Paste only the JWT. Staff access
        and platform-admin role checks remain enforced.
