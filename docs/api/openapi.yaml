    Post:
      type: object
      description: |-
        Site-scoped post authoring contract.

        Site, status, publication timestamp, revision and workflow attribution are
        server-managed; the caller edits content, routing slug, taxonomy and the
        allowlisted SEO object.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Immutable identifier. UUIDs are assigned once and can never
            be changed or re-sequenced, so ids are not enumerable across Sites.
        site:
          type: integer
          readOnly: true
          description: Owning Site. Content cannot be moved between Sites.
        title:
          type: string
          description: Human-readable post title in this row's language.
          maxLength: 255
        slug:
          oneOf:
          - type: string
            maxLength: 128
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        excerpt:
          type: string
          description: Optional summary excerpt shown on listing pages.
        content:
          type: string
          description: Full rich-text body; markdown-friendly, sanitized on write.
        excerpt_html:
          type: string
          description: HTML-sanitized version of excerpt for rendering.
        author:
          type: integer
          nullable: true
          description: Platform user who authored this post.
        featured_media:
          type: string
          description: URL or path to a featured image or video asset.
          maxLength: 512
        seo:
          description: 'Allowlisted SEO metadata: meta_title, meta_description, og_image_ref.
            Unsupported keys and non-string values are rejected.'
        categories:
          type: array
          items:
            type: string
            format: uuid
            description: Immutable identifier. UUIDs are assigned once and can never
              be changed or re-sequenced, so ids are not enumerable across Sites.
        tags:
          type: array
          items:
            type: string
            format: uuid
            description: Immutable identifier. UUIDs are assigned once and can never
              be changed or re-sequenced, so ids are not enumerable across Sites.
        locale:
          description: BCP-47-style language tag in the same format as the Site's
            language codes. Empty means the Site's default language; an explicit value
            must be enabled for the Site. Storage format only — this does not claim
            a translation workflow.
          oneOf:
          - type: string
            pattern: ^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$
            maxLength: 35
          - type: string
            maxLength: 0
        status:
          allOf:
          - $ref: '#/components/schemas/ContentStatusEnum'
          readOnly: true
          description: |-
            Shared draft, review, approval, publication, unpublication and archive workflow.

            * `DRAFT` - Draft
            * `IN_REVIEW` - In review
            * `APPROVED` - Approved
            * `PUBLISHED` - Published
            * `UNPUBLISHED` - Unpublished
            * `ARCHIVED` - Archived
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the record was first published. Set on the first publish
            and kept as history if the record is unpublished.
        blocks:
          description: 'Ordered structured content: a JSON array of typed block objects
            (heading, paragraph, image, button, list, section) validated against the
            documented, versioned block schema. Paragraph rich text is sanitized on
            write. An empty list is valid and every content type — this one and future
            Post records — shares the same blocks.'
        blocks_version:
          type: string
          readOnly: true
          description: Schema version the blocks were written with, stored so future
            block-schema migrations can interpret and migrate stored payloads. Server-managed.
        revision_number:
          type: integer
          readOnly: true
          description: Monotonically increasing content revision used for optimistic
            concurrency.
        created_by:
          type: integer
          readOnly: true
          nullable: true
          description: Authoring platform user, cleared if the account is removed.
        updated_by:
          type: integer
          readOnly: true
          nullable: true
          description: Last editing platform user, cleared if the account is removed.
        submitted_by:
          type: integer
          readOnly: true
          nullable: true
          description: User who most recently submitted this content for review.
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
          description: User who most recently approved or rejected this content.
        review_comment:
          type: string
          readOnly: true
          description: Most recent reviewer comment, retained when content is rejected.
        metadata:
          description: Free-form JSON object for approved content metadata. Not a
            settings document and never a place for secrets.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        available_actions:
          type: array
          items:
            type: string
          readOnly: true
      required:
      - available_actions
      - blocks_version
      - content
      - created_at
      - created_by
      - id
      - published_at
      - review_comment
      - reviewed_by
      - revision_number
      - site
      - status
      - submitted_by
      - title
      - updated_at
      - updated_by
