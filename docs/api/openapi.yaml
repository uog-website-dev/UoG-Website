            language codes. Empty means the Site's default language; an explicit value
            must be enabled for the Site. Storage format only — this does not claim
            a translation workflow.
          oneOf:
          - type: string
            pattern: ^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$
            maxLength: 35
          - type: string
            maxLength: 0
        title:
          type: string
          description: Human-readable page title in this row's language.
          maxLength: 255
        slug:
          type: string
          description: One route segment. Input is normalized (lowercased, runs of
            other characters collapsed to hyphens) before validation, mirroring hostname
            normalization.
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 128
