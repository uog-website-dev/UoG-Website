tags:
- name: CMS
  description: Platform page endpoints authorized by registered application permissions.
- name: Identity
  description: Keycloak identity and platform administration.
- name: Authorization
  description: Database-backed application roles, registered permissions, scoped assignments
    and authorization audit history.
- name: Authorization
  description: Registered permissions, application roles, scoped user assignments
    and audit history.
- name: Organizations
  description: Institutional administration authorized by scoped application permissions.
- name: Sites
  description: Site, configuration and per-site module administration authorized by
    scoped application permissions.
- name: Domains
  description: Hostnames for one Site, including an atomic primary-domain switch.
- name: Site templates
  description: Approved starting configurations. Applying one does not rewrite existing
    Sites.
- name: Modules
  description: Platform capability registry. Planned modules cannot be enabled for
    a Site.
- name: Menu links
  description: Site menu-link administration authorized by scoped application permissions.
- name: Posts
  description: Not implemented.
- name: Menus
  description: 'Site-scoped menu and item administration, atomic tree operations,
    inheritance policy and menu-wide ETag concurrency. Permissions: menu.read, menu.write
    and menu.publish. Inheritance does not grant parent-menu management.'
- name: Public menus
  description: Effective navigation for the Site resolved from the trusted Host. Global,
    inherited and local items follow the Site delivery policy.
