openapi: 3.0.3
info:
  title: University of Gondar Digital Platform API
  version: 1.0.0
  description: Live documentation generated from registered DRF endpoints and serializers.
    Use Authorize with a Keycloak access token (paste the JWT without Bearer). Backend
    permissions are resolved from registered database capabilities and scoped role
    assignments; Keycloak claims authenticate identities only. Protected management
    APIs require the explicit database platform-administrator assignment or a matching
    scoped application permission. No scope header grants access. Content capabilities
    without an API/workflow are not enabled.
paths:
  /api/admin/overview/:
    get:
      operationId: admin_overview_retrieve
      description: Platform totals. Requires an explicit active database-backed Platform
        Administrator assignment. Keycloak realm claims and Django staff flags do
        not grant this operation.
      tags:
      - Identity
      security:
      - keycloakBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverview'
              examples:
                PlatformOverview:
                  value:
                    pages: 2
                    published_pages: 1
                    users: 3
                    requested_by: devuser
                  summary: Platform overview
          description: ''
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
        '401':
          description: Missing, expired or invalid Keycloak credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                error:
                  code: not_authenticated
                  message: Authentication failed or credentials are missing.
                  details:
                    detail: Authentication failed or credentials are missing.
                request_id: 1ea47c51-f2d7-402b-ad9a-4df619d03055
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
        '403':
          description: Authenticated caller lacks permission, or session CSRF failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                error:
                  code: permission_denied
                  message: You do not have permission to perform this action.
                  details:
                    detail: You do not have permission to perform this action.
                request_id: 1ea47c51-f2d7-402b-ad9a-4df619d03055
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
        '405':
          description: Method is not supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
        '406':
          description: Requested response format is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
      parameters:
      - name: X-Request-ID
        in: header
        required: false
        description: Optional UUID correlation ID. Invalid values are replaced.
        schema:
          type: string
          format: uuid
