  /api/v1/authorization/assignments/users/{user_id}/effective/:
    get:
      operationId: v1_authorization_assignments_users_effective_retrieve
      description: Registered effective permissions for one active user at one validated
        scope. Requires platform.users.view in that scope, or an active database platform-administrator
        assignment. Keycloak realm roles do not grant access. Expired, revoked, inactive-role
        and inactive-permission grants are omitted. The platform-administrator policy
        returns only that role's approved capability set. A denied caller receives
        403 and no permission list. Unknown users, sites and organizations return
        404. Malformed identifiers and inconsistent scope combinations return 400.
      parameters:
      - in: query
        name: organization
        schema:
          type: integer
        description: Organization id. Required for ORGANIZATION. With a site, it must
          be that site's owner.
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - ORGANIZATION
          - PLATFORM
          - SITE
        description: PLATFORM rejects organization and site. ORGANIZATION requires
          organization and rejects site. SITE requires site.
        required: true
      - in: query
        name: site
        schema:
          type: integer
        description: Site id. Required for SITE. When organization is omitted, ownership
          is read from the Site.
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      - name: X-Request-ID
        in: header
        required: false
        description: Optional UUID correlation ID. Invalid values are replaced.
        schema:
          type: string
          format: uuid
      tags:
      - Authorization
      security:
      - keycloakBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermission'
