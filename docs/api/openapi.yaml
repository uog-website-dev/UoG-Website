        code:
          type: string
          readOnly: true
          description: Globally unique, normalized to uppercase and immutable after
            creation.
        name:
          type: string
          maxLength: 255
        short_name:
          type: string
          maxLength: 100
        organization_unit:
          type: integer
        default_language:
          type: string
          pattern: ^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$
          maxLength: 35
        status:
          allOf:
          - $ref: '#/components/schemas/SiteStatusEnum'
          readOnly: true
        is_main:
          type: boolean
          description: Main university property; must belong to the UNIVERSITY root.
        template:
          type: integer
          nullable: true
          description: Template whose defaults were copied at provisioning. Later
            template edits do not change this Site.
        configuration:
          readOnly: true
          description: Versioned allowlisted settings. Empty objects receive schema
            version 1 defaults.
        primary_domain:
          allOf:
          - $ref: '#/components/schemas/PrimaryDomainSummary'
          nullable: true
          readOnly: true
          description: Current primary hostname, or null. Included to avoid a hostname
            request for every Site row.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - configuration
      - created_at
      - id
      - name
      - organization_unit
      - primary_domain
      - status
      - updated_at
    SourceEnum:
      enum:
      - global
      - inherited
      - local
      type: string
      description: |-
        * `global` - global
        * `inherited` - inherited
        * `local` - local
    Summary:
      type: object
      properties:
        matched_sites:
          type: integer
        eligible_sites:
          type: integer
          description: Sites with at least one expected change.
        already_in_state_sites:
          type: integer
        blocked_sites:
          type: integer
          description: Sites with at least one blocked module. Their blocked modules
            are skipped.
        expected_changes:
          type: integer
          description: Site-module pairs that apply will change.
        unchanged_pairs:
          type: integer
        blocked_pairs:
          type: integer
        blocked_reasons:
          type: array
          items:
            $ref: '#/components/schemas/BlockedReason'
      required:
      - already_in_state_sites
      - blocked_pairs
      - blocked_reasons
      - blocked_sites
      - eligible_sites
      - expected_changes
      - matched_sites
      - unchanged_pairs
    TreeOutput:
      type: object
      properties:
        menu:
          $ref: '#/components/schemas/MenuOutput'
        include_inactive:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItemOutput'
          description: Bounded preorder tree; each item's parent identifies its nesting.
      required:
      - include_inactive
      - items
      - menu
    VisibilityEnum:
      enum:
      - PUBLIC
      - UNLISTED
      - HIDDEN
      type: string
      description: |-
        * `PUBLIC` - Public
        * `UNLISTED` - Unlisted
        * `HIDDEN` - Hidden
    Warning:
      type: object
      properties:
        module:
          type: string
        message:
          type: string
      required:
      - message
      - module
    WorkflowActionInputActionEnum:
      enum:
      - submit
      - approve
      - reject
      - publish
      - unpublish
      - archive
      - restore
      type: string
      description: |-
        * `submit` - submit
        * `approve` - approve
        * `reject` - reject
        * `publish` - publish
        * `unpublish` - unpublish
        * `archive` - archive
        * `restore` - restore
    WorkflowActionInputRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/WorkflowActionInputActionEnum'
        comment:
          type: string
          default: ''
          maxLength: 5000
      required:
      - action
    WorkflowContent:
      oneOf:
      - $ref: '#/components/schemas/SitePage'
      - $ref: '#/components/schemas/Post'
      - $ref: '#/components/schemas/SiteContent'
    WorkflowHistory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        from_status:
          allOf:
          - $ref: '#/components/schemas/ContentStatusEnum'
          readOnly: true
        to_status:
          allOf:
          - $ref: '#/components/schemas/ContentStatusEnum'
          readOnly: true
        actor:
          type: integer
          readOnly: true
          nullable: true
        comment:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor
      - comment
      - created_at
      - from_status
      - id
      - to_status
    APIError:
      type: object
      required:
      - error
      - request_id
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
              example: validation_error
            message:
              type: string
              example: The request is invalid.
            details:
              description: Field errors or a detail message from DRF.
        request_id:
          type: string
          format: uuid
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    keycloakBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token. Signature, issuer, audience, expiry and
        authorized client are verified by the backend. Paste only the JWT. Staff access
        and platform-admin role checks remain enforced.
tags:
- name: CMS
  description: Platform page endpoints authorized by registered application permissions.
- name: Identity
  description: Keycloak identity and platform administration.
- name: Authorization
  description: Database-backed application roles, registered permissions, scoped assignments
    and authorization audit history.
- name: Authorization
  description: Registered permissions, application roles, scoped user assignments
    and audit history.
- name: Organizations
  description: Institutional administration authorized by scoped application permissions.
- name: Sites
  description: Site, configuration and per-site module administration authorized by
    scoped application permissions.
- name: Domains
  description: Hostnames for one Site, including an atomic primary-domain switch.
- name: Site templates
  description: Approved starting configurations. Applying one does not rewrite existing
    Sites.
- name: Modules
  description: Platform capability registry. Planned modules cannot be enabled for
    a Site.
- name: Module management
  description: 'Platform-admin activation of modules across Sites: previewed, confirmed,
    all-or-nothing bulk operations with dependency checks, operation history and audit.'
- name: Menu links
  description: Site menu-link administration authorized by scoped application permissions.
- name: Posts
  description: Site-scoped post authoring, category and tag administration. Requires
    a Site CMS authoring role and the POSTS module enabled for the Site.
- name: Menus
  description: 'Site-scoped menu and item administration, atomic tree operations,
    inheritance policy and menu-wide ETag concurrency. Permissions: menu.read, menu.write
    and menu.publish. Inheritance does not grant parent-menu management.'
- name: Public menus
  description: Effective navigation for the Site resolved from the trusted Host. Global,
    inherited and local items follow the Site delivery policy.
