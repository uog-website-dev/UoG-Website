  /api/v1/site-modules/bulk-apply/:
    post:
      operationId: v1_site_modules_bulk_apply_create
      description: Platform admin only. Recomputes
        the plan under row locks and commits every expected change, its history rows
        and audit events in one transaction, or nothing. Blocked pairs are skipped.
        A plan that differs from the preview returns 409 stale_preview. High-impact
        operations need a reason and confirmation equal to the preview's confirmation_phrase.
        Content is never deleted.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: Client-generated UUID for this confirmed operation. Repeating
          it returns the committed result; reusing it for a different request returns
          409.
        required: true
      - name: X-Request-ID
        in: header
        required: false
        description: Optional UUID correlation ID. Invalid values are replaced.
        schema:
          type: string
          format: uuid
      tags:
      - Module management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequestRequest'
        required: true
      security:
      - keycloakBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
          description: ''
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
          description: ''
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              examples:
                StalePreview:
                  value:
                    error:
                      code: conflict
                      message: The request conflicts with the current resource state.
                      details:
                        reason: stale_preview
                        message: Sites or modules changed after the preview. Review
                          the new preview before applying.
                        summary: {}
                    request_id: 1ea47c51-f2d7-402b-ad9a-4df619d03055
                  summary: Stale preview
          description: Stale or expired preview, or a reused Idempotency-Key. Nothing
            changed.
