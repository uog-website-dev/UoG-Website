  /api/v1/organizations/:
    get:
      operationId: v1_organizations_list
      description: Platform-admin only. Database-backed discovery with combined AND
        filters; search matches name OR code. All lifecycle states unless filtered.
        Page-number pagination (20), deterministic ordering. Unknown, repeated or
        invalid query parameters return 400.
      parameters:
      - in: query
        name: code
        schema:
          type: string
        description: Exact code, trimmed and normalized to uppercase. Maximum 64 characters.
      - in: query
        name: name
        schema:
          type: string
        description: Case-insensitive literal name substring. Maximum 255 characters.
      - in: query
        name: ordering
        schema:
          type: string
        description: Comma-separated code, name, created_at, updated_at; '-' for descending.
          Default code. Unique code ascending is appended as a tie-breaker if absent.
          Unknown/duplicate fields return 400.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: parent
        schema:
          type: string
        description: Direct parent bigint ID, or literal 'null' for roots. Valid but
          absent/invisible parent IDs yield an empty list.
      - in: query
        name: search
        schema:
          type: string
        description: Trimmed, case-insensitive literal substring of name OR code;
          blank means no search. Maximum 255 characters.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - ARCHIVED
          - INACTIVE
        description: 'Exact lifecycle status. Omitted: all states.'
      - in: query
        name: type
        schema:
          type: string
        description: Exact existing managed organization type code, for example COLLEGE.
          Case-sensitive; unknown codes return 400.
      - name: X-Request-ID
        in: header
        required: false
        description: Optional UUID correlation ID. Invalid values are replaced.
        schema:
          type: string
          format: uuid
      tags:
      - Organizations
      security:
      - keycloakBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationList'
          description: ''
          headers:
            X-Request-ID:
              description: Correlation ID for this request.
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid body, malformed input, or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
              example:
                error:
                  code: validation_error
                  message: The request is invalid.
                  details:
                    status:
                    - '"INVALID" is not a valid choice.'
                request_id: 1ea47c51-f2d7-402b-ad9a-4df619d03055
          headers:
