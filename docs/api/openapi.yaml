components:
  schemas:
    ActiveInactiveStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
    AdminOverview:
      type: object
      properties:
        pages:
          type: integer
          minimum: 0
        published_pages:
          type: integer
          minimum: 0
        users:
          type: integer
          minimum: 0
        requested_by:
          type: string
      required:
      - pages
      - published_pages
      - requested_by
      - users
    Identity:
      type: object
      properties:
        username:
          type: string
        email:
          oneOf:
          - type: string
            format: email
          - type: string
            maxLength: 0
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        is_staff:
          type: boolean
        client_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        expires_at:
          type: integer
          description: Access-token expiry as Unix seconds.
      required:
      - client_id
      - email
      - expires_at
      - is_staff
      - name
      - roles
      - scopes
      - username
    Module:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          description: Globally unique registry code, immutable after creation.
          maxLength: 64
        name:
          type: string
          maxLength: 255
        description:
          type: string
          description: What this capability is. A planned module is not available
            to Sites.
        status:
          $ref: '#/components/schemas/ModuleStatusEnum'
        is_enabled:
          type: boolean
          description: Global switch. Only an implemented module can be enabled.
        configuration_schema:
          description: Approved settings shape for a shipped module. Empty until a
            schema is approved.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - description
      - id
      - name
      - updated_at
    ModuleRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          description: Globally unique registry code, immutable after creation.
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          minLength: 1
          description: What this capability is. A planned module is not available
            to Sites.
        status:
          $ref: '#/components/schemas/ModuleStatusEnum'
        is_enabled:
          type: boolean
          description: Global switch. Only an implemented module can be enabled.
        configuration_schema:
          description: Approved settings shape for a shipped module. Empty until a
            schema is approved.
      required:
      - code
      - description
      - name
    ModuleStatusEnum:
      enum:
      - PLANNED
      - IMPLEMENTED
      - DEPRECATED
      type: string
      description: |-
        * `PLANNED` - Planned
        * `IMPLEMENTED` - Implemented
        * `DEPRECATED` - Deprecated
