    SitePage:
      type: object
      description: |-
        The Page contract future content endpoints reuse.

        Identity, Site, computed route, homepage flag and lifecycle are
        server-managed; the caller may edit content, routing inputs and
        presentation hints. `parent` and `locale` are create-only: moving a
        subtree must go through the change_route service (which records URL
        history) and a page's language is fixed at creation.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Immutable identifier. UUIDs are assigned once and can never
            be changed or re-sequenced, so ids are not enumerable across Sites.
        site:
          type: integer
          readOnly: true
          description: Owning Site. Content cannot be moved between Sites.
        parent:
          type: string
          format: uuid
          description: Parent page. Must belong to the same Site and locale; pages
            never move across Sites or languages and a page can never become its own
            ancestor.
          nullable: true
        locale:
          description: BCP-47-style language tag in the same format as the Site's
            language codes. Empty means the Site's default language; an explicit value
            must be enabled for the Site. Storage format only — this does not claim
            a translation workflow.
          oneOf:
          - type: string
            pattern: ^[a-z]{2,3}(?:-[a-z0-9]{2,8})*$
            maxLength: 35
          - type: string
            maxLength: 0
        title:
          type: string
          description: Human-readable page title in this row's language.
          maxLength: 255
        slug:
          type: string
          description: One route segment. Input is normalized (lowercased, runs of
            other characters collapsed to hyphens) before validation, mirroring hostname
            normalization.
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 128
        path:
          type: string
          readOnly: true
          description: Computed full route within this Site and locale, such as /about/people.
            Recomputed on every save and unique per (site, locale).
        layout:
          description: Approved layout code the rendering layer resolves; empty uses
            the Site's default layout. A reference, never a template file and never
            a secret.
          oneOf:
          - type: string
            pattern: ^[A-Z][A-Z0-9_-]{0,63}$
            maxLength: 64
          - type: string
            maxLength: 0
        seo:
          description: 'Allowlisted SEO object: meta_title, meta_description, og_image_ref.
            Unsupported keys and non-string values are rejected; never a place for
            secrets.'
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          description: |-
            PUBLIC is served and listed, UNLISTED is served only by its direct route, HIDDEN is never served publicly. None of them publish a draft.

            * `PUBLIC` - Public
            * `UNLISTED` - Unlisted
            * `HIDDEN` - Hidden
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Sibling ordering hint; ties are broken by id so lists are stable.
        is_homepage:
          type: boolean
          readOnly: true
          description: Designates the page that serves the Site root. At most one
            per Site (partial unique index), maintained through the set_as_homepage
            service so replacement is atomic.
        status:
          allOf:
          - $ref: '#/components/schemas/ContentStatusEnum'
          readOnly: true
          description: |-
            Shared draft, review, approval, publication, unpublication and archive workflow.

            * `DRAFT` - Draft
            * `IN_REVIEW` - In review
            * `APPROVED` - Approved
            * `PUBLISHED` - Published
            * `UNPUBLISHED` - Unpublished
            * `ARCHIVED` - Archived
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When the record was first published. Set on the first publish
            and kept as history if the record is unpublished.
        blocks:
          description: 'Ordered structured content: a JSON array of typed block objects
            (heading, paragraph, image, button, list, section) validated against the
            documented, versioned block schema. Paragraph rich text is sanitized on
            write. An empty list is valid and every content type — this one and future
            Post records — shares the same blocks.'
        blocks_version:
          type: string
          readOnly: true
          description: Schema version the blocks were written with, stored so future
            block-schema migrations can interpret and migrate stored payloads. Server-managed.
        revision_number:
          type: integer
          readOnly: true
          description: Monotonically increasing content revision used for optimistic
            concurrency.
        created_by:
          type: integer
          readOnly: true
          nullable: true
          description: Authoring platform user, cleared if the account is removed.
        updated_by:
          type: integer
          readOnly: true
          nullable: true
          description: Last editing platform user, cleared if the account is removed.
        submitted_by:
          type: integer
          readOnly: true
          nullable: true
          description: User who most recently submitted this content for review.
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
          description: User who most recently approved or rejected this content.
        review_comment:
          type: string
          readOnly: true
          description: Most recent reviewer comment, retained when content is rejected.
        metadata:
          description: Free-form JSON object for approved content metadata. Not a
            settings document and never a place for secrets.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blocks_version
      - created_at
      - created_by
      - id
      - is_homepage
      - path
      - published_at
      - review_comment
      - reviewed_by
      - revision_number
