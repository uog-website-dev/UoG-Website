  /api/pages/:
    get:
      operationId: pages_list
      description: Published platform-wide pages. Page-number pagination uses page
        (20 items per page). Default order is newest created_at first. Filtering,
        search, client-selected sorting and Organization/Site scoping are not implemented;
        unknown query parameters do not scope access.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: X-Request-ID
        in: header
        required: false
        description: Optional UUID correlation ID. Invalid values are replaced.
        schema:
          type: string
          format: uuid
      tags:
      - CMS
      security:
      - keycloakBearer: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPageList'
              examples:
                PublishedPage:
                  value:
                    count: 123
                    next: http://api.example.org/accounts/?page=4
                    previous: http://api.example.org/accounts/?page=2
                    results:
                    - id: 1
                      title: About UoG
                      slug: about-uog
                      content: <p>About the university</p>
                      description: University overview
                      is_published: true
                      created_at: '2026-10-23T08:00:00Z'
                      updated_at: '2026-10-23T08:00:00Z'
                  summary: Published page
          description: ''
