components:
  schemas:
    ActivationEnum:
      enum:
      - ENABLED
      - DISABLED
      - NOT_ASSIGNED
      type: string
      description: |-
        * `ENABLED` - ENABLED
        * `DISABLED` - DISABLED
        * `NOT_ASSIGNED` - NOT_ASSIGNED
    ActivationSummary:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/ModuleStatusEnum'
        implementation_status:
          $ref: '#/components/schemas/ImplementationStatusEnum'
        is_shipped:
          type: boolean
        platform_enabled:
          type: boolean
        enabled_sites:
          type: integer
        disabled_sites:
          type: integer
        eligible_sites:
          type: integer
          description: Non-archived Sites that can use the module now. Zero when the
            module is unavailable.
        total_sites:
          type: integer
        requires:
          type: array
          items:
            type: string
        required_by:
          type: array
          items:
            type: string
        updated_at:
