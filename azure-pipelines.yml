# Azure Pipeline for UoG Website
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: docker-hub-credentials
  - name: imageBackend
    value: 'uog-website-backend'
  - name: imageFrontend
    value: 'uog-website-frontend'
  - name: tag
    value: '$(Build.BuildId)'

stages:
  - stage: BuildAndTest
    displayName: 'Build and Test'
    jobs:
      - job: TestBackend
        displayName: 'Test Backend'
        steps:
          - checkout: self
          - script: |
              cd backend
              pip install -r requirements.txt
              python manage.py check
            displayName: 'Run Django checks'
      
      - job: BuildFrontend
        displayName: 'Build Frontend'
        steps:
          - checkout: self
          - script: |
              cd frontend
              npm install
              npm run build
            displayName: 'Build React app'

  - stage: DockerPush
    displayName: 'Push to Docker Hub'
    dependsOn: BuildAndTest
    jobs:
      - job: Push
        displayName: 'Build and Push'
        steps:
          - checkout: self
          
          - script: |
              echo "Logging into Docker Hub..."
              echo "$(dockerHubPassword)" | docker login -u "$(dockerHubOrganization)" --password-stdin
            displayName: 'Docker Hub Login'
            env:
              dockerHubPassword: $(dockerHubPassword)
          
          - script: |
              docker build -t $(dockerHubOrganization)/$(imageBackend):$(tag) -f backend/Dockerfile ./backend
              docker tag $(dockerHubOrganization)/$(imageBackend):$(tag) $(dockerHubOrganization)/$(imageBackend):latest
              docker push $(dockerHubOrganization)/$(imageBackend):$(tag)
              docker push $(dockerHubOrganization)/$(imageBackend):latest
            displayName: 'Build and Push Backend'
          
          - script: |
              docker build -t $(dockerHubOrganization)/$(imageFrontend):$(tag) -f frontend/Dockerfile ./frontend
              docker tag $(dockerHubOrganization)/$(imageFrontend):$(tag) $(dockerHubOrganization)/$(imageFrontend):latest
              docker push $(dockerHubOrganization)/$(imageFrontend):$(tag)
              docker push $(dockerHubOrganization)/$(imageFrontend):latest
            displayName: 'Build and Push Frontend'

  - stage: PublishArtifacts
    displayName: '📦 Publish Deployment Artifacts'
    dependsOn: DockerPush
    jobs:
      - job: Publish
        displayName: 'Publish Compose Files'
        steps:
          - checkout: self
          
          # Create deployment package
          - script: |
              mkdir -p $(Build.ArtifactStagingDirectory)/deployment
              cp docker-compose.prod.yml $(Build.ArtifactStagingDirectory)/deployment/
              cp .env.prod.example $(Build.ArtifactStagingDirectory)/deployment/
              cp deploy.sh $(Build.ArtifactStagingDirectory)/deployment/
              echo "Tag: $(tag)" > $(Build.ArtifactStagingDirectory)/deployment/VERSION.txt
              echo "Build ID: $(Build.BuildId)" >> $(Build.ArtifactStagingDirectory)/deployment/VERSION.txt
            displayName: 'Prepare Deployment Package'
          
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/deployment'
              ArtifactName: 'deployment'
            displayName: 'Publish Deployment Artifacts'

  - stage: Summary
    displayName: '📊 Summary'
    dependsOn: PublishArtifacts
    condition: always()
    jobs:
      - job: Summary
        displayName: 'Build Summary'
        steps:
          - script: |
              echo "========================================="
              echo "🎉 BUILD COMPLETE! 🎉"
              echo "========================================="
              echo ""
              echo "🐳 Docker Images:"
              echo "   Backend: uogwebsite/uog-website-backend:$(tag)"
              echo "   Backend: uogwebsite/uog-website-backend:latest"
              echo "   Frontend: uogwebsite/uog-website-frontend:$(tag)"
              echo "   Frontend: uogwebsite/uog-website-frontend:latest"
              echo ""
              echo "📦 Deployment Artifacts:"
              echo "   docker-compose.prod.yml"
              echo "   .env.prod.example"
              echo "   deploy.sh"
              echo "   VERSION.txt"
              echo ""
              echo "🔗 Docker Hub: https://hub.docker.com/u/uogwebsite"
              echo "========================================="
            displayName: 'Summary'