# Complete Azure Pipeline for UoG Website
# This pipeline: Builds -> Tests -> Creates Docker Images -> Pushes to Docker Hub -> Deploys to VM

trigger:
  branches:
    include:
      - main
      - init
      - master

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Docker Hub Configuration
  - name: dockerHubOrganization
    value: 'uogwebsite'
  - name: imageBackend
    value: 'uog-website-backend'
  - name: imageFrontend
    value: 'uog-website-frontend'
  - name: tag
    value: '$(Build.BuildId)'
  
  # Deployment Configuration (Update these with your VM details)
  - name: vmHost
    value: ''  # Enter your VM IP or hostname
  - name: vmUsername
    value: ''  # Enter your VM username
  - name: backendContainerName
    value: 'uog-backend'
  - name: frontendContainerName
    value: 'uog-frontend'
  - name: backendPort
    value: '8000'
  - name: frontendPort
    value: '80'

stages:
  # ============================================================
  # STAGE 1: Build and Test
  # ============================================================
  - stage: BuildAndTest
    displayName: '🔨 Build and Test'
    jobs:
      - job: TestBackend
        displayName: '🐍 Test Backend (Django)'
        steps:
          - checkout: self
          
          - script: |
              echo "========================================="
              echo "Testing Backend"
              echo "========================================="
              cd backend
              echo "Installing Python dependencies..."
              pip install -r requirements.txt
              echo "Running Django system checks..."
              python manage.py check
              echo "✅ Backend tests passed!"
            displayName: 'Run Backend Tests'
            continueOnError: false
      
      - job: BuildFrontend
        displayName: '⚛️ Build Frontend (React)'
        steps:
          - checkout: self
          
          - script: |
              echo "========================================="
              echo "Building Frontend"
              echo "========================================="
              cd frontend
              echo "Installing Node dependencies..."
              npm install
              echo "Building React application..."
              npm run build
              echo "✅ Frontend build complete!"
            displayName: 'Build Frontend'
          
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'frontend/build'
              ArtifactName: 'frontend-build'
            displayName: '📦 Publish Frontend Artifacts'

  # ============================================================
  # STAGE 2: Docker Build and Push
  # ============================================================
  - stage: DockerBuildAndPush
    displayName: '🐳 Build and Push Docker Images'
    dependsOn: BuildAndTest
    condition: succeeded()
    jobs:
      - job: DockerLogin
        displayName: '🔐 Login to Docker Hub'
        steps:
          - script: |
              echo "Logging into Docker Hub as $(dockerHubOrganization)..."
              echo "$(dockerHubPassword)" | docker login -u "$(dockerHubOrganization)" --password-stdin
              echo "✅ Docker Hub login successful!"
            displayName: 'Docker Hub Authentication'
            env:
              dockerHubPassword: $(dockerHubPassword)
      
      - job: BuildBackendImage
        displayName: '🏗️ Build Backend Docker Image'
        dependsOn: DockerLogin
        steps:
          - checkout: self
          
          - script: |
              echo "========================================="
              echo "Building Backend Docker Image"
              echo "========================================="
              echo "Image: $(dockerHubOrganization)/$(imageBackend):$(tag)"
              docker build -t $(dockerHubOrganization)/$(imageBackend):$(tag) -f backend/Dockerfile ./backend
              docker tag $(dockerHubOrganization)/$(imageBackend):$(tag) $(dockerHubOrganization)/$(imageBackend):latest
              echo "✅ Backend image built successfully!"
            displayName: 'Build Backend Image'
          
          - script: |
              echo "Pushing backend image to Docker Hub..."
              docker push $(dockerHubOrganization)/$(imageBackend):$(tag)
              docker push $(dockerHubOrganization)/$(imageBackend):latest
              echo "✅ Backend image pushed successfully!"
            displayName: 'Push Backend Image'
      
      - job: BuildFrontendImage
        displayName: '🏗️ Build Frontend Docker Image'
        dependsOn: DockerLogin
        steps:
          - checkout: self
          
          - script: |
              echo "========================================="
              echo "Building Frontend Docker Image"
              echo "========================================="
              echo "Image: $(dockerHubOrganization)/$(imageFrontend):$(tag)"
              docker build -t $(dockerHubOrganization)/$(imageFrontend):$(tag) -f frontend/Dockerfile ./frontend
              docker tag $(dockerHubOrganization)/$(imageFrontend):$(tag) $(dockerHubOrganization)/$(imageFrontend):latest
              echo "✅ Frontend image built successfully!"
            displayName: 'Build Frontend Image'
          
          - script: |
              echo "Pushing frontend image to Docker Hub..."
              docker push $(dockerHubOrganization)/$(imageFrontend):$(tag)
              docker push $(dockerHubOrganization)/$(imageFrontend):latest
              echo "✅ Frontend image pushed successfully!"
            displayName: 'Push Frontend Image'

  # ============================================================
  # STAGE 3: Deploy to University VM (Self-hosted Agent Required)
  # ============================================================
  - stage: DeployToVM
    displayName: '🚀 Deploy to University VM'
    dependsOn: DockerBuildAndPush
    condition: and(succeeded(), ne(variables['vmHost'], ''))
    jobs:
      - deployment: Deploy
        displayName: 'Deploy Containers'
        pool:
          name: Default  # This must be your self-hosted agent pool name
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "========================================="
                    echo "Starting Deployment to University VM"
                    echo "========================================="
                    echo "Target: $(vmHost)"
                    echo "Backend Container: $(backendContainerName)"
                    echo "Frontend Container: $(frontendContainerName)"
                  displayName: '📋 Deployment Information'
                
                - script: |
                    echo "Logging into Docker Hub on VM..."
                    ssh $(vmUsername)@$(vmHost) "echo '$(dockerHubPassword)' | docker login -u '$(dockerHubOrganization)' --password-stdin"
                    echo "✅ Docker Hub login successful on VM!"
                  displayName: '🔐 Docker Login on VM'
                  env:
                    dockerHubPassword: $(dockerHubPassword)
                
                - script: |
                    echo "Stopping and removing old containers..."
                    ssh $(vmUsername)@$(vmHost) "docker stop $(backendContainerName) $(frontendContainerName) || true"
                    ssh $(vmUsername)@$(vmHost) "docker rm $(backendContainerName) $(frontendContainerName) || true"
                    echo "✅ Old containers removed"
                  displayName: '🛑 Stop Old Containers'
                
                - script: |
                    echo "Pulling latest images from Docker Hub..."
                    ssh $(vmUsername)@$(vmHost) "docker pull $(dockerHubOrganization)/$(imageBackend):latest"
                    ssh $(vmUsername)@$(vmHost) "docker pull $(dockerHubOrganization)/$(imageFrontend):latest"
                    echo "✅ Latest images pulled"
                  displayName: '📥 Pull Latest Images'
                
                - script: |
                    echo "Starting Backend Container..."
                    ssh $(vmUsername)@$(vmHost) "docker run -d \
                      --name $(backendContainerName) \
                      --restart unless-stopped \
                      -p $(backendPort):8000 \
                      -e DJANGO_SETTINGS_MODULE=config.settings \
                      $(dockerHubOrganization)/$(imageBackend):latest"
                    echo "✅ Backend container started on port $(backendPort)"
                  displayName: '▶️ Start Backend Container'
                
                - script: |
                    echo "Starting Frontend Container..."
                    ssh $(vmUsername)@$(vmHost) "docker run -d \
                      --name $(frontendContainerName) \
                      --restart unless-stopped \
                      -p $(frontendPort):80 \
                      $(dockerHubOrganization)/$(imageFrontend):latest"
                    echo "✅ Frontend container started on port $(frontendPort)"
                  displayName: '▶️ Start Frontend Container'
                
                - script: |
                    echo "========================================="
                    echo "🎉 DEPLOYMENT COMPLETE! 🎉"
                    echo "========================================="
                    echo "🌐 Frontend: http://$(vmHost):$(frontendPort)"
                    echo "📡 Backend API: http://$(vmHost):$(backendPort)/api/"
                    echo ""
                    echo "Running containers on VM:"
                    ssh $(vmUsername)@$(vmHost) "docker ps --filter 'name=$(backendContainerName)' --filter 'name=$(frontendContainerName)'"
                    echo "========================================="
                  displayName: '📊 Deployment Summary'
                
                - script: |
                    echo "Cleaning up old Docker images on VM..."
                    ssh $(vmUsername)@$(vmHost) "docker system prune -f"
                    echo "✅ Cleanup complete"
                  displayName: '🧹 Cleanup Old Images'
                    continueOnError: true

  # ============================================================
  # STAGE 4: Final Summary
  # ============================================================
  - stage: Summary
    displayName: '📊 Build Summary'
    dependsOn: 
      - BuildAndTest
      - DockerBuildAndPush
    condition: always()
    jobs:
      - job: Summary
        displayName: 'Display Build Results'
        steps:
          - script: |
              echo "========================================="
              echo "🏆 UoG WEBSITE BUILD SUMMARY 🏆"
              echo "========================================="
              echo ""
              echo "📦 Build Information:"
              echo "   Build ID: $(Build.BuildId)"
              echo "   Branch: $(Build.SourceBranchName)"
              echo "   Commit: $(Build.SourceVersion)"
              echo "   Status: $(Agent.JobStatus)"
              echo ""
              echo "🐳 Docker Images:"
              echo "   Backend: $(dockerHubOrganization)/$(imageBackend):$(tag)"
              echo "   Backend: $(dockerHubOrganization)/$(imageBackend):latest"
              echo "   Frontend: $(dockerHubOrganization)/$(imageFrontend):$(tag)"
              echo "   Frontend: $(dockerHubOrganization)/$(imageFrontend):latest"
              echo ""
              echo "🔗 Docker Hub: https://hub.docker.com/u/$(dockerHubOrganization)"
              echo ""
              if [ "$(vmHost)" != "" ]; then
                echo "🚀 Deployment Target:"
                echo "   VM: $(vmHost)"
                echo "   Frontend URL: http://$(vmHost):$(frontendPort)"
                echo "   Backend API: http://$(vmHost):$(backendPort)/api/"
              else
                echo "⚠️  VM Deployment Skipped: vmHost variable not configured"
                echo "   To enable deployment, set vmHost and vmUsername variables"
              fi
              echo "========================================="
            displayName: '📊 Build Summary'