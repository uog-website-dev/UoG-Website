# Complete Azure Pipeline for UoG Website with Artifacts
trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: docker-hub-credentials
  - name: dockerHubOrganization
    value: 'uogwebsite'
  - name: imageBackend
    value: 'uog-website-backend'
  - name: imageFrontend
    value: 'uog-website-frontend'
  - name: tag
    value: '$(Build.BuildId)'

stages:
  - stage: BuildTestAndPush
    displayName: 'Build, Test, Push & Package'
    jobs:
      - job: BuildAndTest
        displayName: 'Build and Test'
        services:
          # The backend test suite needs a real PostgreSQL: pytest-django
          # creates and drops the temporary `test_uog_db` database, and the
          # migrations inside it are executed by the migration role. The
          # container publishes 5432 on the agent, so the steps below reach
          # it on localhost.
          postgres:
            image: postgres:16.15-alpine
            env:
              POSTGRES_USER: $(postgresAdminUser)
              POSTGRES_PASSWORD: $(postgresAdminPassword)
              POSTGRES_DB: $(appDatabase)
              POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
              # Consumed by infrastructure/postgres/init/01-init-roles.sh —
              # the same role separation the development stack uses.
              DB_USER: $(appRole)
              DB_MIGRATE_USER: $(migrateRole)
              DB_APP_PASSWORD: $(appRolePassword)
              DB_MIGRATE_PASSWORD: $(migrateRolePassword)
            ports:
              - 5432:5432
            options: >-
              --health-cmd "pg_isready -U uog_admin -d uog_db"
              --health-interval 5s
              --health-timeout 5s
              --health-retries 12
        variables:
          # Throwaway credentials for the ephemeral CI database. They are
          # derived from the build id, so no static secret is committed and
          # every build gets fresh ones; the container is destroyed with the
          # agent.
          postgresAdminUser: 'uog_admin'
          postgresAdminPassword: 'ci-postgres-admin-$(Build.BuildId)'
          appDatabase: 'uog_db'
          appRole: 'uog_app'
          migrateRole: 'uog_migrate'
          appRolePassword: 'ci-app-role-$(Build.BuildId)'
          migrateRolePassword: 'ci-migrate-role-$(Build.BuildId)'
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            displayName: 'Use Python 3.12'
            inputs:
              versionSpec: '3.12'

          - script: bash scripts/ci/postgres-service.sh
            displayName: 'Bootstrap PostgreSQL roles'
            env:
              DB_USER: $(appRole)
              DB_MIGRATE_USER: $(migrateRole)

          - script: |
              set -euo pipefail
              cd backend
              python -m pip install --upgrade pip
              python -m pip install -r requirements/dev.txt
              python manage.py check
              python -c "import os, psycopg; conn = psycopg.connect(host=os.environ['DB_HOST'], port=int(os.environ['DB_PORT']), dbname=os.environ['DB_NAME'], user=os.environ['DB_MIGRATE_USER'], password=os.environ['DB_MIGRATE_PASSWORD']); cur = conn.cursor(); cur.execute('select current_user'); print('database reachable as', cur.fetchone()[0]); conn.close()"
              pytest
            displayName: 'Test Backend'
            env:
              DB_HOST: localhost
              DB_PORT: '5432'
              DB_NAME: $(appDatabase)
              DB_USER: $(appRole)
              DB_PASSWORD: $(appRolePassword)
              DB_MIGRATE_USER: $(migrateRole)
              DB_MIGRATE_PASSWORD: $(migrateRolePassword)
              SECRET_KEY: 'ci-only-secret-key'
              DEBUG: 'False'

          - script: |
              corepack enable
              cd frontend
              pnpm install --frozen-lockfile
              pnpm build
            displayName: 'Build Frontend'
      
      - job: DockerAndArtifacts
        displayName: 'Docker Push and Artifacts'
        dependsOn: BuildAndTest
        steps:
          - checkout: self
          
          - script: |
              echo "Logging into Docker Hub..."
              echo "$(dockerHubPassword)" | docker login -u "$(dockerHubOrganization)" --password-stdin
            displayName: 'Docker Login'
            env:
              dockerHubPassword: $(dockerHubPassword)
          
          - script: |
              docker build -t $(dockerHubOrganization)/$(imageBackend):$(tag) -f backend/Dockerfile ./backend
              docker tag $(dockerHubOrganization)/$(imageBackend):$(tag) $(dockerHubOrganization)/$(imageBackend):latest
              docker push $(dockerHubOrganization)/$(imageBackend):$(tag)
              docker push $(dockerHubOrganization)/$(imageBackend):latest
            displayName: 'Push Backend'
          
          - script: |
              docker build -t $(dockerHubOrganization)/$(imageFrontend):$(tag) -f frontend/Dockerfile ./frontend
              docker tag $(dockerHubOrganization)/$(imageFrontend):$(tag) $(dockerHubOrganization)/$(imageFrontend):latest
              docker push $(dockerHubOrganization)/$(imageFrontend):$(tag)
              docker push $(dockerHubOrganization)/$(imageFrontend):latest
            displayName: 'Push Frontend'
          
          # Create and publish artifact
          - script: |
              echo "Creating deployment package..."
              mkdir -p $(Build.ArtifactStagingDirectory)/deployment
              
              # Copy files if they exist
              if [ -f docker-compose.prod.yml ]; then
                cp docker-compose.prod.yml $(Build.ArtifactStagingDirectory)/deployment/
                echo "✅ Copied docker-compose.prod.yml"
              else
                echo "⚠️ docker-compose.prod.yml not found"
              fi
              
              if [ -f .env.prod.example ]; then
                cp .env.prod.example $(Build.ArtifactStagingDirectory)/deployment/
                echo "✅ Copied .env.prod.example"
              else
                echo "⚠️ .env.prod.example not found"
              fi
              
              if [ -f deploy.sh ]; then
                cp deploy.sh $(Build.ArtifactStagingDirectory)/deployment/
                echo "✅ Copied deploy.sh"
              else
                echo "⚠️ deploy.sh not found"
              fi
              
              echo "VERSION=$(tag)" > $(Build.ArtifactStagingDirectory)/deployment/VERSION.txt
              echo "BUILD_ID=$(Build.BuildId)" >> $(Build.ArtifactStagingDirectory)/deployment/VERSION.txt
              echo "BUILD_DATE=$(date -u)" >> $(Build.ArtifactStagingDirectory)/deployment/VERSION.txt
              
              echo ""
              echo "Deployment package contents:"
              ls -la $(Build.ArtifactStagingDirectory)/deployment/
            displayName: 'Create Deployment Package'
          
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/deployment'
              ArtifactName: 'deployment'
              publishLocation: 'Container'
            displayName: 'Publish Artifacts'
          
          - script: |
              echo "========================================="
              echo "✅ BUILD COMPLETE!"
              echo "========================================="
              echo "Images pushed to Docker Hub"
              echo "Artifact published: deployment"
              echo "========================================="
            displayName: 'Summary'